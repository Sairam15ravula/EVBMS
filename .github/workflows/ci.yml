name: Enterprise EV Battery Intelligence CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-ml-verification:
    name: Backend Pytest & ML Model Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install joblib pandas scikit-learn xgboost numpy pytest httpx fastapi pydantic-settings alembic google-genai pyjwt passlib bcrypt python-multipart email-validator sqlalchemy asyncpg

      - name: Retrain ML Models & Generate SHA256 Checksums
        run: |
          python backend/train_models.py

      - name: Run Pytest Backend Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run E2E System Pipeline Verification
        run: |
          python scripts/verify_pipeline.py

  frontend-build-and-test:
    name: Frontend Vitest & Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Run Frontend Production Build
        run: |
          npm run build
